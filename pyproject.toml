[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "askdata"
version = "1.1.0"
description = "中文问数 Agent：把自然语言问题变成可执行的 SQL，并给出可复现的准确率"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["text2sql", "llm", "duckdb", "nl2sql", "evaluation"]

# 运行时只依赖两个包：DuckDB 是嵌入式数据库，sqlglot 用来做 AST 白名单校验。
# 刻意不引 Web 框架、不引 ORM——HTTP 用标准库，模板用原生 HTML。
dependencies = [
    "duckdb==2.0.0",
    "sqlglot==30.33.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "python-docx>=1.1",
    "openapi-spec-validator>=0.7",
]

[project.scripts]
askdata = "askdata.cli:main"

[project.urls]
"Source" = "https://github.com/f1sh59/askdata"
"Bug Tracker" = "https://github.com/f1sh59/askdata/issues"

# ---------------------------------------------------------------- 工具配置

[tool.setuptools]
packages = ["askdata", "askdata.strategies"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "reports", "tmp_acceptance", "docs"]

[tool.ruff.lint]
# E/F 是基础错误、I 是 import 排序、B 是常见 bug、UP 是语法现代化、
# N 是命名、SIM 是化简、RUF 是 ruff 自有规则。
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = [
    "E501",  # 行宽交给 formatter，不在 lint 里卡
    "B008",  # 函数默认值是函数调用（Pydantic/FastAPI 风格常见）
    "N802",  # HTTP handler 必须是 do_GET 这种驼峰
    # 下面三条把中文标点判成"歧义字符"。中文项目必须关掉，否则 900+ 条噪音。
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N806", "SIM117"]  # 测试里允许大写局部变量、嵌套 with
"scripts/make_docs.py" = ["N806"]  # pPr / tcPr 是 python-docx 的惯用写法

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
# 逐步收紧：先保证核心模块类型干净，scripts 与 tests 暂不强制
files = ["askdata"]
exclude = ["askdata/strategies/"]

[[tool.mypy.overrides]]
module = ["duckdb.*", "sqlglot.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# 现有 134 个用例是 unittest 风格，pytest 能直接收集；新测试建议写 pytest 风格
addopts = "-q --strict-markers"
markers = [
    "slow: 需要真实调用大模型的测试（默认不跑，避免烧 token）",
]

[tool.coverage.run]
source = ["askdata"]
omit = ["askdata/strategies/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# 门槛是防倒退的棘轮，不是 KPI：当前 85.5%，再往上要补
# CLI 里 clarify/closed 两个命令的参数解析和 service 的导入分支。
fail_under = 85
